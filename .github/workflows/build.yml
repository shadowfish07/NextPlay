name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: "3.35.1"
  JAVA_VERSION: "17"

jobs:
  test:
    name: Test and Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Fast verification and coverage gate
        run: tool/verify_fast.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  android-e2e:
    name: Android E2E
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          rg --version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run deterministic Android E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: NextPlay_CI_API_35
          disable-animations: true
          script: NEXTPLAY_AVD=NextPlay_CI_API_35 NEXTPLAY_ANDROID_DEVICE=emulator-5554 tool/e2e_android.sh

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-evidence
          path: .artifacts/e2e
          if-no-files-found: warn
          retention-days: 7

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [test, android-e2e]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate code
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Get version info
        id: version
        run: |
          # Get semantic version if available
          SEMANTIC_VERSION=""
          if command -v npx &> /dev/null; then
            SEMANTIC_VERSION=$(npx semantic-release --dry-run --no-ci 2>/dev/null | grep -oP 'The next release version is \K\d+\.\d+\.\d+' || echo "")
          fi

          # Get current version from pubspec.yaml
          CURRENT_VERSION=$(grep -oP 'version: \K[^+]+' pubspec.yaml)

          # Choose version
          VERSION=${SEMANTIC_VERSION:-$CURRENT_VERSION}
          BUILD_NUMBER=${{ github.run_number }}

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build-number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION+$BUILD_NUMBER"

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build-number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
